<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HA Web Deployer</title>
	<link rel="stylesheet" href="admin.css">
</head>
<body>
	<main>
		<header>
			<h1>Site web</h1>
			<a class="button secondary" href="apercu/" target="_blank" rel="noopener">Voir l'aperçu ↗</a>
		</header>

		<section class="card" aria-labelledby="etat-titre">
			<h2 id="etat-titre">État</h2>
			<ul class="status">
				<li><span id="tunnel-dot" class="dot"></span><span id="tunnel-text">Chargement…</span></li>
				<li><span id="site-dot" class="dot"></span><span id="site-text"></span></li>
			</ul>
			<ul id="hostnames" class="hostnames"></ul>
			<p id="lan" class="lan" hidden>Sur ton réseau local : <a id="lan-link" target="_blank" rel="noopener"></a></p>
		</section>

		<section class="card" aria-labelledby="publier-titre">
			<h2 id="publier-titre">Publier</h2>
			<div id="dropzone" class="dropzone">
				<p class="drop-title">Glisse ici le dossier de ton site</p>
				<p class="drop-hint">Il remplace tout le site d'un coup. Des fichiers seuls sont ajoutés ou remplacés.</p>
				<div class="drop-actions">
					<label class="button">
						Choisir un dossier
						<input id="pick-folder" type="file" webkitdirectory multiple hidden>
					</label>
					<label class="button secondary">
						Ajouter des fichiers
						<input id="pick-files" type="file" multiple hidden>
					</label>
				</div>
			</div>
			<p id="message" class="message" role="status" aria-live="polite"></p>
		</section>

		<section class="card" aria-labelledby="fichiers-titre">
			<div class="card-head">
				<h2 id="fichiers-titre">Fichiers en ligne</h2>
				<button id="clear" class="link danger" type="button">Tout supprimer</button>
			</div>
			<p id="empty" class="empty" hidden>Aucun fichier pour l'instant.</p>
			<table id="files">
				<tbody></tbody>
			</table>
		</section>
	</main>
	<script src="admin.js"></script>
</body>
</html>
