<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HA Web Deployer</title>
	<link rel="stylesheet" href="admin.css">
</head>
<body>
	<main>
		<header>
			<h1>Sites web</h1>
		</header>

		<section class="card" aria-label="Tunnel Cloudflare">
			<ul class="status">
				<li><span id="tunnel-dot" class="dot"></span><span id="tunnel-text">Chargement…</span></li>
			</ul>
			<ul id="tunnel-alerts" class="alerts"></ul>
		</section>

		<nav id="tabs" class="tabs" aria-label="Sites"></nav>

		<section class="card" aria-labelledby="site-title">
			<div class="card-head">
				<h2 id="site-title"></h2>
				<a id="preview" class="button secondary" target="_blank" rel="noopener">Voir l'aperçu ↗</a>
			</div>
			<ul class="status">
				<li><span id="site-dot" class="dot"></span><span id="site-text"></span></li>
			</ul>
			<ul id="links" class="links"></ul>
			<p id="port-hint" class="hint" hidden></p>

			<div id="dropzone" class="dropzone">
				<p class="drop-title">Glisse ici le dossier du site</p>
				<p class="drop-hint">Il remplace tout le site d'un coup. Des fichiers seuls sont ajoutés ou remplacés.</p>
				<div class="drop-actions">
					<label class="button">
						Choisir un dossier
						<input id="pick-folder" type="file" webkitdirectory multiple hidden>
					</label>
					<label class="button secondary">
						Ajouter des fichiers
						<input id="pick-files" type="file" multiple hidden>
					</label>
				</div>
			</div>
			<p id="message" class="message" role="status" aria-live="polite"></p>

			<div class="card-head files-head">
				<h3>Fichiers en ligne</h3>
				<button id="clear" class="link danger" type="button">Tout supprimer</button>
			</div>
			<p id="empty" class="empty" hidden>Aucun fichier pour l'instant.</p>
			<table id="files">
				<tbody></tbody>
			</table>
		</section>
	</main>
	<script src="admin.js"></script>
</body>
</html>
