name: HA Web Deployer
version: "0.4.0"
slug: hawebdeployer
description: >-
  Héberge un site web statique sur Home Assistant et le publie sur Internet
  via Cloudflare Tunnel, sans ouvrir de port ni exposer Home Assistant.
url: https://github.com/Nailaky/HAwebDeployer
# Image construite par GitHub Actions : Home Assistant la télécharge au lieu de la construire
image: ghcr.io/nailaky/{arch}-hawebdeployer
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: share
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:web
# Un site par port : 8080 est ouvert sur le réseau local, les autres à activer
ports:
  8080/tcp: 8080
  8081/tcp: null
  8082/tcp: null
  8083/tcp: null
  8084/tcp: null
  8085/tcp: null
  8086/tcp: null
  8087/tcp: null
  8088/tcp: null
  8089/tcp: null
ports_description:
  8080/tcp: Site du port 8080 sur le réseau local
  8081/tcp: Site du port 8081 sur le réseau local
  8082/tcp: Site du port 8082 sur le réseau local
  8083/tcp: Site du port 8083 sur le réseau local
  8084/tcp: Site du port 8084 sur le réseau local
  8085/tcp: Site du port 8085 sur le réseau local
  8086/tcp: Site du port 8086 sur le réseau local
  8087/tcp: Site du port 8087 sur le réseau local
  8088/tcp: Site du port 8088 sur le réseau local
  8089/tcp: Site du port 8089 sur le réseau local
options:
  site_folder: www
  ha_services: []
  worker_variables: []
  content_security_policy: >-
    default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
    frame-ancestors 'none'; base-uri 'self'; form-action 'self'
schema:
  site_folder: "match(^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$)"
  cloudflare_tunnel_token: password?
  ha_services:
    - "match(^[a-z0-9_]+\\.[a-z0-9_]+$)"
  worker_variables:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: password
  content_security_policy: "match(^[^\"]*$)?"
