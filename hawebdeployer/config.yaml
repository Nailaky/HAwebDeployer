name: HA Web Deployer
version: "0.3.0"
slug: hawebdeployer
description: >-
  Héberge un site web statique sur Home Assistant et le publie sur Internet
  via Cloudflare Tunnel, sans ouvrir de port ni exposer Home Assistant.
url: https://github.com/Nailaky/HAwebDeployer
# Image construite par GitHub Actions : Home Assistant la télécharge au lieu de la construire
image: ghcr.io/nailaky/{arch}-hawebdeployer
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: share
    read_only: false
ingress: true
ingress_port: 8099
panel_icon: mdi:web
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Accès au site depuis le réseau local (http://<ip-de-home-assistant>:8080)
options:
  site_folder: www
  ha_services: []
  worker_variables: []
  content_security_policy: >-
    default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
    frame-ancestors 'none'; base-uri 'self'; form-action 'self'
schema:
  site_folder: "match(^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$)"
  cloudflare_tunnel_token: password?
  ha_services:
    - "match(^[a-z0-9_]+\\.[a-z0-9_]+$)"
  worker_variables:
    - name: "match(^[A-Za-z_][A-Za-z0-9_]*$)"
      value: password
  content_security_policy: "match(^[^\"]*$)?"
